name: Security scan

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  Security-scan-for-dependencies:
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read

    steps:
      # リポジトリをチェックアウト
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: "refs/pull/${{ github.event.number }}/merge"

      # Bunをセットアップ
      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24
          package-manager-cache: false

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          no-cache: true

      # AikidoSec Safe Chainをセットアップ
      - name: Install safe-chain
        env:
          SAFE_CHAIN_VERSION: 1.5.7
          SAFE_CHAIN_INSTALLER_SHA256: 07ab512fd8795ce41b2275be369aced4c9a93cc7bca9b397951507891a955239
        run: |
          set -euo pipefail
          curl -fsSL \
            --output /tmp/install-safe-chain.sh \
            "https://github.com/AikidoSec/safe-chain/releases/download/${SAFE_CHAIN_VERSION}/install-safe-chain.sh"
          echo "${SAFE_CHAIN_INSTALLER_SHA256}  /tmp/install-safe-chain.sh" | sha256sum -c -
          sh /tmp/install-safe-chain.sh --ci

      - name: Verify safe-chain
        run: bun safe-chain-verify

      - name: Scan dependencies with safe-chain
        run: bun install --ignore-scripts

      # Betterleaksをセットアップ
      - name: Install Betterleaks
        env:
          BETTERLEAKS_VERSION: 1.4.1
          BETTERLEAKS_ARCHIVE_SHA256: 2635ff988d9194cd3070155138589081a54a3438d79ca9b83268addd2fd844cc
        run: |
          set -euo pipefail
          curl -fsSL \
            --output /tmp/betterleaks.tar.gz \
            "https://github.com/betterleaks/betterleaks/releases/download/v${BETTERLEAKS_VERSION}/betterleaks_${BETTERLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${BETTERLEAKS_ARCHIVE_SHA256}  /tmp/betterleaks.tar.gz" | sha256sum -c -
          mkdir -p /tmp/betterleaks
          tar -xzf /tmp/betterleaks.tar.gz -C /tmp/betterleaks

      - name: Betterleaks scan
        run: /tmp/betterleaks/betterleaks git .

      - name: Anti-trojan-source scan
        run: bunx anti-trojan-source --scan .

      # GitHub Actions workflowをzizmorでスキャン
      - name: Zizmor scan
        uses: zizmorcore/zizmor-action@6fc4b006235f201fdab3722e17240ab420d580e5 # v0.6.1
        with:
          advanced-security: false
          annotations: true
